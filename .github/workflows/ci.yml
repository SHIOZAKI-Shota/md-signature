name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: TypeScript core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run check:web-standard
      - run: npm test
      - name: Generated playground files are up to date
        run: |
          npm run build:tsa-roots
          npm run build:docs
          git diff --exit-code -- ../../docs/vendor/core ../../docs/tsa-roots.json src/tsa-roots.ts

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/ ./cmd/mdsig
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal mdsig)"
