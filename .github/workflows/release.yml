name: Release

# Pushing a tag vX.Y.Z builds the binaries, signs the checksums, publishes the GitHub release,
# updates the Homebrew tap, and opens a pull request on microsoft/winget-pkgs (en-US by GoReleaser, ja-JP added
# from .github/winget/) when DISTRIBUTE_TOKEN is set, then publishes packages/core to npm as @mdsig/core.
#
# Secrets:
#   TAP_DEPLOY_KEY       private half of a deploy key with write access to SHIOZAKI-Shota/homebrew-tap
#   DISTRIBUTE_TOKEN     optional; classic token with public_repo, used to push to the SHIOZAKI-Shota/winget-pkgs
#                        fork and open the pull request on microsoft/winget-pkgs

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Choose publishers
        id: skip
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          DISTRIBUTE_TOKEN: ${{ secrets.DISTRIBUTE_TOKEN }}
        run: |
          skip=""
          if [ -z "$TAP_DEPLOY_KEY" ]; then skip="homebrew"; echo "::warning::TAP_DEPLOY_KEY is not set: the Homebrew tap is not updated"; fi
          if [ -z "$DISTRIBUTE_TOKEN" ]; then skip="${skip:+$skip,}winget"; echo "::notice::DISTRIBUTE_TOKEN is not set: winget is skipped"; fi
          echo "args=${skip:+--skip=$skip}" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ steps.skip.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          DISTRIBUTE_TOKEN: ${{ secrets.DISTRIBUTE_TOKEN }}
      - name: Add the ja-JP winget locale
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          file="ShiozakiShota.mdsig.locale.ja-JP.yaml"
          sed "s/{{VERSION}}/$version/g" ".github/winget/$file" > "$RUNNER_TEMP/$file"
          gh api -X PUT "repos/SHIOZAKI-Shota/winget-pkgs/contents/manifests/s/ShiozakiShota/mdsig/$version/$file" \
            -f message="Add ja-JP locale for ShiozakiShota.mdsig $version" \
            -f branch="mdsig-$version" \
            -f content="$(base64 -w0 "$RUNNER_TEMP/$file")"

  # npm trusted publishing (OIDC): the package settings on npmjs.com must name this repository and release.yml
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The package version must match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p 'require("./package.json").version')"
          if [ "$have" != "$want" ]; then echo "::error::packages/core/package.json is $have, tag is $GITHUB_REF_NAME"; exit 1; fi
      - name: Skip a version that is already on npm
        id: published
        run: |
          if npm view "@mdsig/core@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@mdsig/core ${GITHUB_REF_NAME#v} is already published"
          fi
      - run: npm install -g npm@latest
        if: steps.published.outputs.skip != 'true'
      - run: npm ci
        if: steps.published.outputs.skip != 'true'
      - run: npm publish --provenance --access public
        if: steps.published.outputs.skip != 'true'
