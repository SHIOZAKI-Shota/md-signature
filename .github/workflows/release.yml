name: Release

# Pushing a tag vX.Y.Z builds the binaries, signs the checksums, publishes the GitHub release,
# and updates the Homebrew tap (and winget, when its token is set).
#
# Secrets:
#   TAP_DEPLOY_KEY       private half of a deploy key with write access to SHIOZAKI-Shota/homebrew-tap
#   WINGET_GITHUB_TOKEN  optional; classic token with public_repo for the SHIOZAKI-Shota/winget-pkgs fork

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Choose publishers
        id: skip
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          skip=""
          if [ -z "$TAP_DEPLOY_KEY" ]; then skip="homebrew"; echo "::warning::TAP_DEPLOY_KEY is not set: the Homebrew tap is not updated"; fi
          if [ -z "$WINGET_GITHUB_TOKEN" ]; then skip="${skip:+$skip,}winget"; echo "::notice::WINGET_GITHUB_TOKEN is not set: winget is skipped"; fi
          echo "args=${skip:+--skip=$skip}" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ steps.skip.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
