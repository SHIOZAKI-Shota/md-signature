version: 2

project_name: mdsig

before:
  hooks:
    # the release must build from the committed go.sum, so nothing here may rewrite it
    - sh -c "go mod verify && go vet ./... && go test ./..."

builds:
  - id: mdsig
    main: ./cmd/mdsig
    binary: mdsig
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath, -mod=readonly]
    ldflags:
      - -s -w -X mdsig.dev/internal/cli.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.ja.md
      - LICENSE
      - LICENSE-SPEC
      - SPEC.md
      - CLI_SPEC.md
      - SPEC.ja.md
      - CLI_SPEC.ja.md

checksum:
  name_template: checksums.txt

# keyless signing needs cosign and an OIDC identity (GitHub Actions: permissions id-token: write)
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

# needs syft
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: SHIOZAKI-Shota
    name: md-signature
  # the tag is the release version; the signature format has its own version
  name_template: "{{ .Tag }} (format 0.0.4)"
  # published at once: the Homebrew cask below points at these assets
  draft: false
  prerelease: auto

nfpms:
  - id: packages
    package_name: mdsig
    vendor: md-signature
    homepage: https://mdsig.dev/
    maintainer: SHIOZAKI Shota <noreply@users.noreply.github.com>
    description: Sign and verify Markdown documents with embedded md-signature blocks.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin

homebrew_casks:
  - name: mdsig
    repository:
      owner: SHIOZAKI-Shota
      name: homebrew-tap
      branch: main
      # pushed with a deploy key that can write to the tap only (secret TAP_DEPLOY_KEY)
      git:
        url: "ssh://git@github.com/SHIOZAKI-Shota/homebrew-tap.git"
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    homepage: https://mdsig.dev/
    description: Sign and verify Markdown documents with embedded md-signature blocks.
    license: MIT
    binaries: [mdsig]
    # binaries are not notarized yet; without this Gatekeeper refuses to run the quarantined file
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/mdsig"]

winget:
  # fields and wording follow ShiozakiShota.ClauseDown (microsoft/winget-pkgs#480545)
  - name: mdsig
    package_name: mdsig
    publisher: SHIOZAKI-Shota
    package_identifier: ShiozakiShota.mdsig
    author: SHIOZAKI-Shota
    # ClauseDown names its LICENSE holder here; this repository's LICENSE names the contributors
    copyright: Copyright © 2026 md-signature contributors
    license: MIT
    license_url: https://github.com/SHIOZAKI-Shota/md-signature/blob/HEAD/LICENSE
    homepage: https://mdsig.dev/
    publisher_url: https://shiozakishota.com/
    publisher_support_url: https://github.com/SHIOZAKI-Shota/md-signature/issues
    release_notes_url: "https://github.com/SHIOZAKI-Shota/md-signature/releases/tag/{{ .Tag }}"
    default_locale: en-US
    short_description: Electronic signature tool for Markdown
    description: "Electronic signature tool for Markdown. A command-line tool for Windows, macOS and Linux that appends a signature after the last line of a document as an HTML comment, and verifies it with an SSH key on GitHub, a key published in DNS, or an OpenPGP public key."
    tags:
      - cli
      - digital-signature
      - markdown
      - openpgp
      - signature
    # the ja-JP locale manifest is added by .github/workflows/release.yml (GoReleaser's additional_locales writes Moniker, which the locale schema does not define)
    # winget-pkgs PR title format; the first submission (0.0.3) was retitled "New package: … version 0.0.3" by hand
    commit_msg_template: "Update: {{ .PackageIdentifier }} to {{ .Version }}"
    repository:
      owner: SHIOZAKI-Shota
      name: winget-pkgs
      branch: "mdsig-{{ .Version }}"
      # classic token with public_repo, the same one ClauseDown uses (secret DISTRIBUTE_TOKEN)
      token: "{{ .Env.DISTRIBUTE_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
